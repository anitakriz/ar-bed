mode: train
checkpoint: null

game:
  game: tq
  category: animals
  seed: 1
  max_turns: 20
  rollout_horizon: 2
  rollout_gamma: 0.5
  continuation_samples: 1
  likelihood_cache_path: data/tq/tq_feedback_cache_animals.json
  reward_type: blau
  information_reward_mode: realized
  missing_turn_penalty: 0.25
  invalid_rollout_penalty: 1.0
  active_threshold: 0.01
  oracle_batch_size: 32
  oracle_max_output_tokens: 16000
  oracle_max_retries: 8
  oracle_reasoning_effort: none
  print_samples_every: 5

data:
  dataset_dir: data/tq
  theta_set_path: data/tq/animals_200.json
  sampled_train_path: data/tq/train_sampled_states_200animals.jsonl
  sampled_eval_path: data/tq/eval_sampled_states_200animals.jsonl
  api_provider: azure-openai
  api_model: null
  train_states: 0
  eval_states: 1
  num_samples_per_trajectory: 5
  num_sampled_hypotheses: 15
  include_sampled_candidates: true

model:
  enable_reasoning: true
  name: unsloth/gemma-4-E4B-it
  load_in_4bit: true
  fast_inference: false
  lora:
    enabled: true
    r: 16
    alpha: 32
    bias: none
    use_gradient_checkpointing: unsloth
    random_state: 3407

training:
  beta: 0.0
  num_iterations: 1
  output_dir: outputs/tq_grpo_{reward_type}_{timestamp}
  resume_from_checkpoint: null
  eval_strategy: "no"
  temperature: 1.0
  learning_rate: 0.00001
  optim: adamw_8bit
  lr_scheduler_type: cosine
  warmup_steps: 10
  num_generations: 8
  max_prompt_length: 1024
  max_completion_length: 512
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 16
  max_steps: 250
  logging_steps: 5
  report_to: none
  save_strategy: steps
  save_steps: 25
  save_total_limit: null
  use_vllm: false
  chat_template_kwargs:
    preserve_thinking: false

eval:
  full_game_enabled: false
  full_game_eval_theta_set_path: data/tq/animals_200.json
  full_game_eval_words_path: data/tq/animals_test.json
  full_game_every_n_steps: 25
  full_game_num_eval_words: 50
  full_game_batch_size: 4
  full_game_api_batch_size: 32
  full_game_max_turns: 20
  full_game_max_new_tokens: 512
  full_game_question_retries: 3
  full_game_belief_max_new_tokens: 64
  full_game_max_seq_length: 1024
  full_game_do_sample: false
  full_game_temperature: 1.0
  output_dir: outputs/evaluation

evaluation:
  seed: 1234
  max_eval_words: 50
  bed_llm:
    max_seq_length: 32768
    num_hypotheses: 15
    num_questions: 15
    temperature: 1.3
    consistency_threshold: 0.2
    refill_rounds: 3
    question_retries: 3
    belief_max_new_tokens: 256
    guess_max_new_tokens: 64
    likelihood_batch_size: 64
    store_raw_candidate_completions: true

wandb:
  project: null
  entity: null
  run_id: null
  resume: null

hydra:
  job:
    chdir: false
  job_logging:
    loggers:
      httpx:
        level: WARNING
      httpcore:
        level: WARNING
      huggingface_hub:
        level: WARNING
